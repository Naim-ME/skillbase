<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skillbase</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F121A" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFF3;--surf:#FFFFFF;--ink:#171B26;--mut:#5B6577;--line:#DCE0E8;--track:#E2E6ED;--bd:#AEB6C6;--brand:#051E42;color-scheme:light;
--disp:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F121A;--surf:#171B26;--ink:#ECEFF5;--mut:#9AA4B8;--line:#2A3040;--track:#262C3A;--bd:#4A5268;--brand:#ECEFF5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F121A;--surf:#171B26;--ink:#ECEFF5;--mut:#9AA4B8;--line:#2A3040;--track:#262C3A;--bd:#4A5268;--brand:#ECEFF5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--c,var(--ink));outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:28px 20px 140px}
h1,h2{font-family:var(--disp);margin:0;font-weight:600}
.brand{display:flex;align-items:center;gap:8px;margin:0 0 22px}
.brand .mk{display:block;height:40px;width:auto}
.brand .wm{display:block;width:107px;height:40px;flex:none;background:var(--brand);-webkit-mask:url(logo-word.png) center/100% 100% no-repeat;mask:url(logo-word.png) center/100% 100% no-repeat}
.head h1{font-size:24px;letter-spacing:-.01em}
.head p{margin:2px 0 18px;color:var(--mut);font-size:13px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px}
.card:hover{border-color:var(--c)}
.cm{flex:1;min-width:0}
.cm b{display:block;font:600 14px/1.3 var(--disp);overflow-wrap:anywhere}
.dsc{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:12px;margin-top:1px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:12px;margin:6px 0}
.bar{height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surf));flex:none}
.tile.big{width:44px;height:44px}
.empty{text-align:center;padding:56px 20px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font:600 16px var(--disp);margin-bottom:4px}
.empty p{margin:0 auto 16px;max-width:34ch}
.primary,.ghost{border-radius:10px;padding:9px 16px;font-weight:500;border:1px solid transparent}
.primary{background:var(--ink);color:var(--bg)}
.ghost{background:transparent;border-color:var(--line)}
#fab{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:20}
#fab[hidden]{display:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:center}
nav a{flex:1;max-width:200px;text-align:center;padding:7px;border-radius:9px;color:var(--mut);text-decoration:none;font-weight:500;font-size:13px}
nav a span{opacity:.8;margin-left:4px}
nav a.on{background:var(--ink);color:var(--bg)}
.corner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));z-index:20}
.corner.l{left:16px}.corner.r{right:16px}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;padding:0}
.dt{display:grid;gap:24px;padding-top:30px}
.hero{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.who h1{font-size:20px;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.desc{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;color:var(--mut);font:inherit;padding:0;margin:0 0 16px;outline:none;min-height:21px}
.desc:focus{color:var(--ink)}
.nums{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.pct{font:600 30px/1 var(--disp);letter-spacing:-.02em}
.pct small{font-size:14px;margin-left:1px}
.nums span{color:var(--mut);text-align:right;font-size:12px}
.hero .bar{height:6px}
h2{font-size:15px;margin-bottom:10px}
.add{display:flex;gap:8px;margin-bottom:6px}
.add input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit}
.add input:focus{outline:none;border-color:var(--c)}
.add .ib{width:38px;height:38px;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px}
.tree{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px}
.tree .tree{margin:0 0 4px 9px;padding-left:15px;border-left:1px solid var(--line)}
.cnt{font-size:12px;color:var(--mut)}
.fold{display:flex;align-items:center;gap:2px;height:26px;padding:0 4px 0 8px;border:0;border-radius:8px;background:none;color:var(--mut)}
.fold:hover{background:var(--track);color:var(--ink)}
.ed{flex:1;min-width:0;padding:5px 8px;border-radius:8px;border:1px solid var(--c);background:var(--surf);color:var(--ink);font:inherit}
.ed:focus{outline:none}
.who .ed{font:600 18px var(--disp);padding:6px 10px}
.corner.grp{display:flex;gap:6px}
.cw{display:flex;gap:2px;align-items:stretch}
.cw .card{flex:1;min-width:0;width:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top b{flex:1;min-width:0}
.stars,.rate{display:flex;gap:1px;flex:none}
.stars{margin-top:2px}
.sv{fill:none;stroke:var(--bd);stroke-width:1.6;stroke-linejoin:round}
.sv.on{fill:#F5A623;stroke:#F5A623}
.st{border:0;background:none;padding:2px;display:grid;place-items:center}
.sv{transition:fill .12s,stroke .12s,transform .12s}
@media (hover:hover){
  .rate:hover .sv{fill:#F5A623;stroke:#F5A623}
  .rate .st:hover~.st .sv{fill:none;stroke:var(--bd)}
  .rate .st:hover .sv{transform:scale(1.15)}
}
.rrow{display:flex;justify-content:flex-end;margin:-6px -4px 8px 0}
.grip{display:grid;place-items:center;flex:none;border:0;background:none;color:var(--mut);cursor:grab;touch-action:none;padding:0;border-radius:6px;-webkit-user-select:none;user-select:none}
.cw>.grip{width:20px;opacity:.6}
.row .grip{width:14px;height:28px;margin-right:-4px}
.cw,.tree li{transition:scale .15s ease,box-shadow .15s ease}
.drag{position:relative;z-index:5;scale:1.04;box-shadow:0 12px 28px rgba(0,0,0,.28);border-radius:12px;opacity:.97}
li.drag{scale:1.02;background:var(--surf)}
nav a b{font-weight:inherit}
.mn{margin-left:auto;position:relative}
.mn .round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surf);display:grid;place-items:center;padding:0}
.pop{position:absolute;right:0;top:calc(100% + 6px);min-width:170px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30}
.pop button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;font-weight:500}
.pop button:hover{background:var(--track)}
.pop button.cur{font-weight:600}
.pop{min-width:190px}
.pop small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.head.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sortb{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:13px;font-weight:500}
.dl{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.dl.ok{background:var(--track);color:var(--mut)}
.dl.warn{background:#FFF0B3;color:#6B4B00}
.dl.late{background:#FFDADA;color:#9C1C1C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dl.warn{background:#4D3C08;color:#FFD66B}:root:not([data-theme="light"]) .dl.late{background:#52202A;color:#FF9FA6}}
:root[data-theme="dark"] .dl.warn{background:#4D3C08;color:#FFD66B}
:root[data-theme="dark"] .dl.late{background:#52202A;color:#FF9FA6}
.dlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--mut);font-size:12px}
.dlrow label{display:flex;align-items:center;gap:8px}
.dlrow .dl{margin-left:0;font-size:12px;line-height:22px}
.dlin{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit}
.dll{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{-webkit-touch-callout:none}
.card.cert{border-color:#fff;box-shadow:0 0 6px color-mix(in srgb,var(--c) 30%,#fff)}
.card.cert:hover{border-color:#fff}
.tr{display:flex;align-items:center;gap:6px;flex:none}
.ptk{color:#22A06B;margin-left:6px;vertical-align:-2px}
.rs{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:600;line-height:18px;background:color-mix(in srgb,var(--c) 22%,var(--surf));color:var(--ink)}
.cx{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 22px}
.tg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tg span{margin-right:12px}
.pt{width:26px;height:26px;border-radius:50%;border:0;background:var(--track);color:#fff;display:grid;place-items:center;padding:0;transition:background .15s}
.pt.on{background:#22A06B}
.lb{margin:14px 0 6px;font-weight:600;color:var(--mut);font-size:13px}
.lv{display:flex;align-items:center;gap:10px;padding:5px 0}
.lv.done .txt{color:var(--mut);text-decoration:line-through}
.lvin{width:100%;margin-top:8px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.lvin:focus{outline:none;border-color:var(--c)}
.lvadd{display:flex;gap:8px;align-items:center;margin-top:8px}
.lvadd .lvin{margin-top:0;flex:1;min-width:0}
.lvplus{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:0;background:var(--ink);color:var(--bg);padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:none;font-size:13px;font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cscrim{position:fixed;inset:0;z-index:59}
.ctx{position:fixed;z-index:60;width:200px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.ctx p{margin:6px 10px 4px;font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.ctx button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:none;font-weight:500}
.ctx button:hover{background:var(--track)}
body.dg,body.dg *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
.acts{display:flex;gap:2px;align-items:center}
.sub{opacity:0;transition:opacity .15s}
.row:hover .sub,.row:focus-within .sub{opacity:1}
@media (hover:none){.sub{opacity:.7}}
.addrow{padding:0 0 6px 50px}
.addrow input{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:13px}
.addrow input:focus{outline:none;border-color:var(--c)}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bd);background:transparent;flex:none;display:grid;place-items:center;color:#fff;padding:0;transition:background .15s}
.cb.on{background:var(--c);border-color:var(--c)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.done .txt{color:var(--mut);text-decoration:line-through}
.ib{width:28px;height:28px;border-radius:8px;border:0;background:none;color:var(--mut);display:grid;place-items:center;padding:0}
.ib:hover{background:var(--track);color:var(--ink)}
.note{color:var(--mut);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);transition:.25s;z-index:60;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;padding:0}
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surf);border-radius:16px 16px 0 0;padding:18px 18px calc(16px + env(safe-area-inset-bottom,0px));z-index:41;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes pop{from{opacity:0}}
@media (min-width:600px){.sheet{bottom:auto;top:50%;translate:0 -50%;border-radius:16px;animation:pop .15s ease-out}}
@media (min-width:860px){
  .dt{grid-template-columns:300px 1fr;gap:40px;align-items:start}
  .hero{position:sticky;top:30px}
}
.prev{display:flex;gap:12px;align-items:center;margin:12px 0 10px}
.prev input,.sheet textarea{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.prev input{flex:1;font-weight:500;font-size:15px}
.sheet textarea{resize:none;display:block}
.prev input:focus,.sheet textarea:focus{outline:none;border-color:var(--c)}
.prev input.bad{border-color:#E5484D}
.lbl{margin:16px 0 8px;font-weight:500;color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pick{height:40px;border-radius:10px;border:1px solid transparent;background:var(--bg);color:var(--mut);display:grid;place-items:center;padding:0}
.pick:hover{color:var(--ink)}
.pick.sel{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surf))}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid var(--surf);box-shadow:0 0 0 2px transparent;padding:0}
.dot.sel{box-shadow:0 0 0 2px var(--ink)}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<button id="fab" class="primary" data-act="new" aria-label="New skill" title="New skill" hidden></button>
<nav aria-label="Sections"><a href="#learning" id="n1"><b id="t1">Learning</b><span id="nl"></span></a><a href="#mastered" id="n2"><b id="t2">Mastered</b><span id="nm"></span></a></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<div id="ctx"></div>

(async()=>{try{
  if(!window.claude)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/skills');
  const snap=await ref.get();
  if(snap.exists){const r=JSON.parse(snap.data().json);if((r.t||0)>(S.t||0)){S=r;norm();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}}
  else if(S.skills.length)ref.set({json:JSON.stringify(S)}).catch(()=>{});
  dbDoc=ref;
}catch(e){}})();

function count(a){let d=0,t=0;for(const i of a){if(i.c.length){const [x,y]=count(i.c);d+=x;t+=y}else{t++;if(i.d)d++}}return[d,t]}
function find(a,id){for(const i of a){if(i.id===id)return{i,a};const r=find(i.c,id);if(r)return r}}
const setAll=(a,v)=>a.forEach(i=>{i.d=v;setAll(i.c,v)});
function sync(a){for(const i of a)if(i.c.length){sync(i.c);i.d=i.c.every(k=>k.d)}}
/* each micro skill gets an equal share of 100%; the steps inside it split that share equally, at any depth */
const share=a=>a.length?a.reduce((s,i)=>s+(i.c.length?share(i.c):(i.d?1:0)),0)/a.length:0;
const lvOn=sk=>kind(sk)==='c'&&Array.isArray(sk.lv)&&sk.lv.length>0;
const pctOf=sk=>lvOn(sk)?Math.round(sk.lv.filter(x=>x.d).length/sk.lv.length*100):Math.round(share(sk.items)*100);
const pcount=sk=>lvOn(sk)?[sk.lv.filter(x=>x.d).length,sk.lv.length]:[sk.items.filter(i=>i.d).length,sk.items.length];
/* competition extras: participated badge, result chip, and the block with levels, result, participated and certificate */
const pbadge=sk=>kind(sk)==='c'&&sk.pt?`<svg class="ptk" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Participated"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`:'';
function resChip(sk){
  const R=sk.res;if(kind(sk)!=='c'||!sk.m||!R||!R.t)return '';
  const t=R.t==='rank'?'Rank'+(R.v?' '+R.v:''):R.t==='custom'?(R.v||'Custom'):R.t==='finalist'?'Finalist':'Participation';
  return `<span class="rs">${esc(t)}</span>`;
}
function cxBlock(sk){
  const R=sk.res||{t:'',v:''},lv=sk.lv||[];
  const opts=[['participation','Participation'],['rank','Rank'],['finalist','Finalist'],['custom','Custom']];
  return `<div class="cx"><div class="tg"><button class="pt${sk.pt?' on':''}" data-act="pt" role="checkbox" aria-checked="${!!sk.pt}" aria-label="Participated">${I.ck}</button><span>Participated</span><button class="cb${sk.ct?' on':''}" data-act="ct" role="checkbox" aria-checked="${!!sk.ct}" aria-label="Certificate">${sk.ct?I.ck:''}</button><span>Certificate</span></div>
    <p class="lb">Levels</p>${lv.map(x=>`<div class="lv${x.d?' done':''}"><button class="cb${x.d?' on':''}" data-act="lvtog" data-id="${x.id}" role="checkbox" aria-checked="${x.d}" aria-label="${esc(x.t)}">${x.d?I.ck:''}</button><span class="txt">${esc(x.t)}</span><button class="ib" data-act="lvdel" data-id="${x.id}" aria-label="Remove level ${esc(x.t)}">${I.t}</button></div>`).join('')}
    <div class="lvadd"><input class="lvin" data-lv maxlength="30" enterkeyhint="done" placeholder="Add a level, e.g. Prelims, Regional, Final" aria-label="Add level"><button class="lvplus" data-act="lvadd" aria-label="Add level">${I.p}</button></div>
    <p class="note">${lv.length?'Each level you clear adds an equal share of progress. Tasks no longer count.':'Without levels, tasks drive progress.'}</p>
    ${sk.m?`<p class="lb">Result</p><div class="seg">${opts.map(([v,n])=>`<button class="${R.t===v?'on':''}" data-act="res" data-t="${v}" aria-pressed="${R.t===v}">${n}</button>`).join('')}</div>${R.t==='rank'?`<input class="lvin" data-resv type="number" min="1" inputmode="numeric" placeholder="Rank, e.g. 2" value="${esc(R.v)}" aria-label="Rank">`:''}${R.t==='custom'?`<input class="lvin" data-resv maxlength="40" placeholder="Describe the result" value="${esc(R.v)}" aria-label="Custom result">`:''}`:''}</div>`;
}
/* move between skills, projects and competitions (right click, or long press on touch) */
function ctx(){
  const c=ui.ctx,el=$('#ctx'),sk=c&&S.skills.find(x=>x.id===c.id);
  if(!sk){el.innerHTML='';return}
  const k=kind(sk),x=Math.max(8,Math.min(c.x,innerWidth-208)),y=Math.max(8,Math.min(c.y,innerHeight-170));
  el.innerHTML=`<div class="cscrim" data-act="closectx"></div><div class="ctx" role="menu" style="left:${x}px;top:${y}px"><p>Move “${esc(sk.n)}” to</p>${['s','p','c'].filter(m=>m!==k).map(m=>`<button role="menuitem" data-act="move" data-id="${sk.id}" data-k="${m}">${K[m].Cap}s</button>`).join('')}</div>`;
}
function addLevel(){
  const el=$('input[data-lv]'),sk=cur();if(!el||!sk)return;
  const v=el.value.trim();if(!v){el.focus();return}
  (sk.lv=sk.lv||[]).push({id:uid(),t:v,d:false});ui.fl=true;changed(sk);
}
function moveTo(id,k){
  const sk=S.skills.find(x=>x.id===id);ui.ctx=null;ctx();
  if(!sk||!K[k]||kind(sk)===k)return;
  const snap=JSON.stringify(sk);
  sk.k=k;if(k!=='c')sk.dl='';
  changed(sk);
  toast('Moved “'+sk.n+'” to '+K[k].Cap+'s'+(k==='c'?'. Add a deadline from its page.':''),()=>{const o=JSON.parse(snap);Object.keys(sk).forEach(q=>delete sk[q]);Object.assign(sk,o);persist();render()});
}
/* two modes share one list: skills (micro skills) and projects (milestones) */
const K={
  s:{one:'skill',Cap:'Skill',many:'skills',mic:'micro skill',Mic:'Micro skill',tab1:'Learning',tab2:'Mastered',doing:'in progress',done:'mastered',Done:'Mastered',ph:'What are you learning?'},
  p:{one:'project',Cap:'Project',many:'projects',mic:'milestone',Mic:'Milestone',tab1:'Projects in progress',tab2:'Completed',doing:'in progress',done:'completed',Done:'Completed',ph:'What are you building?'},
  c:{one:'competition',Cap:'Competition',many:'competitions',mic:'task',Mic:'Task',tab1:'Active competitions',tab2:'Completed',doing:'active',done:'completed',Done:'Completed',ph:'Which competition is it?'}
};
const kind=sk=>sk.k==='p'||sk.k==='c'?sk.k:'s';
const mk=()=>K[S.mode]?S.mode:'s';
const md=()=>K[mk()];
const inMode=()=>S.skills.filter(x=>kind(x)===mk());
/* competitions finish by date: the day after the deadline they move to Completed, with their tasks left as they were */
function settleComp(){
  let ch=false;
  for(const x of S.skills){
    if(kind(x)!=='c'||!x.dl)continue;
    const n=dleft(x.dl);
    if(n<0&&!x.m){const [y,mo,d]=x.dl.split('-').map(Number);x.m=new Date(y,mo-1,d+1).getTime();ch=true}
    else if(n>=0&&x.m){x.m=0;ch=true}
  }
  if(ch)persist();
  return ch;
}
/* competitions: days left until the deadline (grey, then yellow within 7 days, red within 3 or overdue) */
const dleft=dl=>{const [y,m,d]=dl.split('-').map(Number),t=new Date();return Math.round((new Date(y,m-1,d)-new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)};
const dpill=sk=>{
  if(kind(sk)!=='c'||sk.m||!sk.dl)return '';
  const n=dleft(sk.dl),cls=n<=3?'late':n<=7?'warn':'ok';
  const txt=n<0?(-n)+(n===-1?' day':' days')+' overdue':n===0?'Due today':n===1?'1 day left':n+' days left';
  return `<span class="dl ${cls}">${txt}</span>`;
};
/* sorting the in-progress list: custom is your own drag order; the others sort a view of it (ties keep your order) */
const SORTS={s:['priority','custom'],p:['priority','custom'],c:['deadline','priority','custom']};
const SL={deadline:'Deadline',priority:'Priority',custom:'Custom'};
const SH={deadline:'Soonest first',priority:'Most stars first',custom:'Your own drag order'};
const sortOf=()=>{const v=(S.sort||{})[mk()];return SORTS[mk()].includes(v)?v:'custom'};
function ordered(l){
  const m=sortOf();if(m==='custom')return l;
  const pr=x=>x.r||0,dv=x=>x.dl?dleft(x.dl):1e9;
  return l.map((x,i)=>[x,i]).sort((a,b)=>m==='priority'?(pr(b[0])-pr(a[0])||a[1]-b[1]):(dv(a[0])-dv(b[0])||a[1]-b[1])).map(q=>q[0]);
}
const sortUI=()=>{

};
const DOTS='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>';

const STAR='M12 2.7l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.2 1.2-6.4L2.8 9.4l6.4-.8z';

function changed(sk){
  sync(sk.items);const [d,t]=lvOn(sk)?pcount(sk):count(sk.items);
  if(!(kind(sk)==='c'&&sk.dl)){if(t&&d===t){if(!sk.m){sk.m=Date.now();toast(K[kind(sk)].Done+' “'+sk.n+'”. Nice work.')}}else sk.m=0}

const cur=()=>{const h=location.hash.slice(1);return h.startsWith('skill-')?S.skills.find(s=>s.id===h.slice(6)):null};

function toast(m,undo){
  const t=$('#toast');t.innerHTML='<span>'+esc(m)+'</span>'+(undo?'<button>Undo</button>':'');
  t.classList.add('show');
  const b=t.querySelector('button');if(b)b.onclick=()=>{undo();t.classList.remove('show')};
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5000);

/* views */
const tile=(sk,big)=>`<span class="tile${big?' big':''}" style="--c:${sk.c}">${ico(sk.i,big?22:18)}</span>`;
function card(sk){
  const [d,t]=pcount(sk),p=pctOf(sk);
  const T=K[kind(sk)],W=lvOn(sk)?'level':T.mic,l=sk.m?T.Done+' on '+fmt(sk.m):(t?d+' of '+t+' '+W+'s':'No '+T.mic+'s yet');
  const r=sk.m?(kind(sk)==='c'?(t?d+' of '+t+' '+W+'s':'No '+T.mic+'s'):t+' '+T.mic+'s'):p+'%';

/* layout box of a list item, ignoring any slide animation still running on it */

  kids.forEach((c,i)=>{const dx=was[i].left-now[i].left,dy=was[i].top-now[i].top;if(dx||dy)c.style.transform='translate('+dx+'px,'+dy+'px)'});
